<div class="container dashboard">
  <div class="dash-header">
    <h1>Admin Dashboard</h1>
    <button type="button" class="btn btn-outline" (click)="logout()">Log Out</button>
  </div>

  <div class="tabs">
    <button type="button" [class.active]="tab() === 'orders'" (click)="tab.set('orders')">Orders</button>
    <button type="button" [class.active]="tab() === 'products'" (click)="tab.set('products')">Products</button>
  </div>

  @if (tab() === 'orders') {
    <app-orders-panel></app-orders-panel>
  } @else {
    <app-products-panel></app-products-panel>
  }
</div>
