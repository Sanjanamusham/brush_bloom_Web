<div class="chat-widget">
  @if (open()) {
    <div class="chat-panel">
      <div class="chat-header">
        <span>Chat with {{ botName }}</span>
        <button type="button" class="close-btn" (click)="toggle()" aria-label="Close chat">×</button>
      </div>

      <div class="chat-body">
        @for (m of messages(); track $index) {
          <div class="msg" [class.user]="m.from === 'user'" [class.bot]="m.from === 'bot'">
            {{ m.text }}
          </div>
        }
      </div>

      <div class="suggested">
        @for (s of suggested; track s.id) {
          <button type="button" class="chip" (click)="askSuggested(s.id)">{{ s.question }}</button>
        }
      </div>

      <div class="fallback-row">
        <a [href]="emailHref">Email us</a>
        <a [href]="whatsappHref" target="_blank" rel="noopener">WhatsApp us</a>
      </div>

      @if (textEnabled()) {
        <form class="chat-input-row" (ngSubmit)="send()">
          <input type="text" [(ngModel)]="input" name="chatInput" placeholder="Type your question…" />
          <button type="submit" class="btn btn-accent">Send</button>
        </form>
      } @else {
        <p class="hint-text">Tap a question above, or choose "Something else" to type your own.</p>
      }
    </div>
  }

  <button
    type="button"
    class="chat-bubble"
    [class.open]="open()"
    (click)="toggle()"
    [attr.aria-label]="open() ? 'Close chat' : 'Open chat with ' + botName"
  >
    @if (!open()) {
      <span class="pulse-ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    } @else {
      <span class="close-icon">×</span>
    }
  </button>
</div>
